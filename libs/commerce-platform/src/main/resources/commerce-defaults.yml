# Configuración común de todos los servicios servlet. Cada servicio la importa con:
#   spring.config.import: classpath:commerce-defaults.yml
# y solo define lo que le es propio (nombre, base de datos, consumer group...).

spring:
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo valida que las entidades coincidan
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # Compatibilidad hacia delante: un productor puede añadir campos nuevos sin romper consumidores
      fail-on-unknown-properties: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Productor idempotente: los reintentos internos del cliente no duplican mensajes en la partición
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Si Kafka no responde, el envío falla rápido y el outbox reintenta más tarde
        max.block.ms: 5000
        request.timeout.ms: 4000
        delivery.timeout.ms: 5000
        linger.ms: 5
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      # Commit del offset tras procesar cada mensaje con éxito (o tras enviarlo al DLT)
      ack-mode: record
      # Un hilo consumidor por partición asignada (3 particiones por topic)
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

commerce:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:1h}
  kafka:
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
    retry:
      max-retries: 3
      initial-interval: 500ms
      multiplier: 2.0
      max-interval: 5s
  outbox:
    poll-interval: 500ms
    batch-size: 50
    max-attempts: 3
    initial-backoff: 2s
    send-timeout: 5s
    retention: 7d

logging:
  pattern:
    # Cada línea incluye servicio, correlation ID y, al procesar un evento, su tipo, id y agregado
    level: "%5p [${spring.application.name:-}] [cid:%X{correlationId:-}] [event:%X{eventType:-} id:%X{eventId:-} aggregate:%X{aggregateId:-}]"
  level:
    org.apache.kafka: WARN
